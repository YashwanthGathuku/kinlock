name: Verified Causal Commit Benchmark

on:
  push:
    branches: [main]
    paths:
      - "src/kinlock/**"
      - "eval/**"
      - "scripts/verified_causal_demo.py"
      - ".github/workflows/verified-causal-benchmark.yml"
  pull_request:
    paths:
      - "src/kinlock/**"
      - "eval/**"
      - "scripts/verified_causal_demo.py"
      - ".github/workflows/verified-causal-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Kinlock
        run: python -m pip install -e ".[dev]"
      - name: Run the end-to-end adversarial benchmark
        run: |
          mkdir -p eval/results
          python eval/verified_causal_benchmark.py --write eval/results/latest.json > /dev/null
      - name: Assert the safety contract
        run: |
          python - <<'PY'
          import json
          r = json.load(open("eval/results/latest.json"))
          m = r["metrics"]
          assert m["unsafe_commit_count"] == 0, m
          assert m["false_block_count"] == 0, m
          assert m["policy_only_stops"] == 0, m
          assert m["stopped_by_proof_layer"] == r["attack_count"], m
          assert m["benign_completion_rate"] == 1.0, m
          print(json.dumps({k: r[k] for k in ("scenario_count", "attack_count", "benign_count", "attack_families", "metrics", "verifier_latency")}, indent=2, sort_keys=True))
          PY
      - name: Exercise the judge demo
        run: python scripts/verified_causal_demo.py --json > eval/results/demo.json
      - uses: actions/upload-artifact@v4
        with:
          name: verified-causal-commit-results
          path: |
            eval/results/latest.json
            eval/results/demo.json
          if-no-files-found: error
