name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Read the vendored kinlock-authority commit
        id: lock
        run: echo "commit=$(python -c 'import json;print(json.load(open("vendor/kinlock-authority.lock.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - name: Check out kinlock-authority at that commit
        uses: actions/checkout@v4
        with:
          repository: YashwanthGathuku/kinlock-authority
          ref: ${{ steps.lock.outputs.commit }}
          path: _upstream/kinlock-authority
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Vendored copy matches its lock and upstream
        run: python scripts/check_vendored_authority.py --upstream _upstream/kinlock-authority
      - name: Test
        env:
          KINLOCK_AUTHORITY_SRC: _upstream/kinlock-authority
        run: pytest -q

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Read the commit the WebAssembly core was built from
        id: wasmlock
        working-directory: .
        run: echo "commit=$(python3 -c 'import json;print(json.load(open("go/internal/authority/kinlock_authority.lock.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - name: Check out kinlock-authority at that commit
        uses: actions/checkout@v4
        with:
          repository: YashwanthGathuku/kinlock-authority
          ref: ${{ steps.wasmlock.outputs.commit }}
          path: _upstream/kinlock-authority
      - name: Vendored vectors are the upstream ones
        working-directory: .
        run: diff -r _upstream/kinlock-authority/conformance/vectors go/internal/authority/testdata/vectors
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test (conformance vectors through WebAssembly, gateway, MCP)
        run: go test -v -count=1 ./...
      - name: Build
        run: go build ./cmd/kinlock-gateway

  docker:
    # The judge demo ships as this image: build it, run it, and check it from outside.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the judge demo image
        run: docker build -t kinlock-demo .
      - name: Run it
        run: |
          docker run -d --name kinlock -p 8080:8080 kinlock-demo
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
      - name: Smoke test as a judge would
        run: python3 scripts/smoke_test.py http://localhost:8080
      - name: Container logs
        if: always()
        run: docker logs kinlock

