name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Read the vendored kinlock-authority commit
        id: lock
        run: echo "commit=$(python -c 'import json;print(json.load(open("vendor/kinlock-authority.lock.json"))["commit"])')" >> "$GITHUB_OUTPUT"
      - name: Check out kinlock-authority at that commit
        uses: actions/checkout@v4
        with:
          repository: YashwanthGathuku/kinlock-authority
          ref: ${{ steps.lock.outputs.commit }}
          path: _upstream/kinlock-authority
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Vendored copy matches its lock and upstream
        run: python scripts/check_vendored_authority.py --upstream _upstream/kinlock-authority
      - name: Test
        env:
          KINLOCK_AUTHORITY_SRC: _upstream/kinlock-authority
        run: pytest -q
