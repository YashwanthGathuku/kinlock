[project]
name = "kinlock"
version = "0.2.0"
description = "Verified authority boundary for AI agents: Kinlock-signed owner intents, caveat-chained delegation, a planner-independent verifier and a single-use commit gate, in front of NVIDIA Nemotron on Nebius Token Factory."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yashwanth Gathuku" }]
dependencies = ["mcp==2.3.0", "uvicorn>=0.30", "httpx2>=2.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kinlock = "kinlock.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 140
target-version = "py311"
# Vendored verbatim from kinlock-authority; linted upstream.
extend-exclude = ["src/kinlock_authority"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Long literal tables and messages are intentional; StrEnum would change str() output of public enums.
ignore = ["E501", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Scripts put src/ on sys.path before importing kinlock.
"scripts/*" = ["E402"]
# Its test pins the allowed stdlib imports to typing, not collections.abc.
"src/kinlock/theustad_verifier.py" = ["UP035"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclass; safe as a default.
extend-immutable-calls = ["kinlock.verified_runtime.TemporalContract"]
