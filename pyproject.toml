[project]
name = "kinlock"
version = "0.2.0"
description = "Verified authority boundary for AI agents: Kinlock-signed owner intents, caveat-chained delegation, a planner-independent verifier and a single-use commit gate, in front of NVIDIA Nemotron on Nebius Token Factory."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Yashwanth Gathuku" }]
dependencies = ["mcp==2.3.0", "uvicorn>=0.30", "httpx2>=2.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kinlock = "kinlock.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
